<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Shelf feature graphic</title>
<!-- Google Play feature graphic, 1024x500. Render: see store/README.md. -->
<style>
  @font-face { font-family: "Geist"; src: url("../src/fonts/geist_variable.ttf"); font-weight: 100 900; }
  @font-face { font-family: "Space Mono"; src: url("../src/fonts/space_mono_bold.ttf"); font-weight: 700; }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: #101013; }
  .wrap { position: relative; width: 1024px; height: 500px; }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
  .over { font: 700 15px "Space Mono", monospace; letter-spacing: 1.2px; color: #A1A1AA; text-transform: uppercase; }
  .mark { margin-top: 8px; display: flex; align-items: center; gap: 22px; font: 900 112px/1 "Geist"; letter-spacing: -4.5px; color: #F2F1E8; }
  .mark svg { width: 92px; height: 67px; margin-top: 14px; }
  .line { margin-top: 26px; font: 500 30px/1.25 "Geist"; letter-spacing: -.4px; color: rgba(242, 241, 232, .72); }
  .line b { color: #F2F1E8; font-weight: 700; }
  .phone {
    position: absolute; right: 64px; top: 46px; width: 330px; height: 587px; overflow: hidden;
    border-radius: 34px; border: 8px solid #2A2A2E; background: #101013;
    box-shadow: 0 30px 80px -10px rgba(0, 0, 0, .7);
  }
  .phone img { display: block; width: 100%; }
  .glow { position: absolute; right: 40px; top: 120px; width: 420px; height: 420px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 175, 1, .22), rgba(255, 175, 1, 0)); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="glow"></div>
    <div class="text">
      <div class="over">Book log</div>
      <div class="mark">Shelf
        <svg viewBox="0 0 11 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#FFAF01" d="M0 0h2v2h-2zM0 3h2v4h-2zM3 1h2v6h-2zM6 3h2v4h-2zM9 1h2v3h-2zM9 5h2v2h-2zM0 7h11v1h-11z"/></svg>
      </div>
      <div class="line">Type a title. <b>Shelf finds the cover.</b><br>Rate it and keep notes.</div>
    </div>
    <div class="phone"><img src="screenshots/1-shelf.png" alt=""></div>
  </div>
</body>
</html>

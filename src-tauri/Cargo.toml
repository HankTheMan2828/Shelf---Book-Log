[package]
name = "shelf"
version = "0.1.0"
description = "A small book logger: covers, ratings and notes."
edition = "2021"

[lib]
# The _lib suffix keeps the lib apart from the bin on Windows (cargo#8519).
name = "shelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls keeps the Android build free of OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
# Backups: the save/open pickers, and writing through Android's content:// URIs they hand back.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# The APK is built with the dev profile (see README), so keep it lean: no debug info, light optimizing.
[profile.dev]
debug = false
strip = "debuginfo"
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
